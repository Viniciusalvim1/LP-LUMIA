# O chamador é um agente externo autenticando por secret key no header
# `apikey`. A checagem de plataforma (verify_jwt) só aceita JWT de usuário
# do Supabase Auth — que não existe neste fluxo —, então ela rejeitaria a
# requisição antes de chegar no handler. A validação da credencial passa a
# ser feita pelo `auth: "secret:blog-agent"` dentro da função.
[functions.upload-post-cover]
verify_jwt = false
